<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Tutor Prototype</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>AI Tutor — Equivalent Fractions</h1>

  <div id="practice">
    <h2>Practice</h2>
    <p id="problem">Loading problem...</p>
    <input type="text" id="answer" placeholder="Your answer">
    <button id="submit-answer" onclick="submitAnswer()">Check</button>
    <button id="next-problem" onclick="loadProblem()" style="display:none;">Next problem</button>
    <p id="result"></p>
  </div>

  <div id="chat"></div>

  <input type="text" id="question" placeholder="Ask the tutor a question...">
  <button onclick="ask()">Send</button>

  <script src="/static/script.js"></script>
</body>
</html>
